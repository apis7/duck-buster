# playship config for one app. Lives at <app repo>/store/play.yaml.
# Relative paths resolve against this file's folder (or `root:` if set).
app:
  name: "Duck Buster: Duck Season Log" # Console app name (≤ 30 chars)
  package: com.duckbuster.app         # PERMANENT once uploaded — must match applicationId
  slug: duck-buster                     # privacy page: apsinthion-apps/<slug>/privacy/
  consoleAppId: "4973549739053022218"                 # the number after /app/ in Console URLs; fill once the app exists
  type: app                        # app | game
  live: false                      # false until the first production review passes → API releases are drafts
  androidDir: ../mobile/android    # generated by expo prebuild
  bundleTask: ":app:bundleRelease"
  aab: ../mobile/android/app/build/outputs/bundle/release/app-release.aab

listing:
  language: en-US
  title: listing/en-US/title.txt                       # ≤ 30
  shortDescription: listing/en-US/short_description.txt # ≤ 80
  fullDescription: listing/en-US/full_description.txt   # ≤ 4000
  releaseNotes: listing/release_notes.txt               # ≤ 500
  icon: icon-512.png                 # 512×512 PNG
  featureGraphic: feature-graphic.png # 1024×500, no alpha
  screenshots: screenshots            # folder, 2–8 PNGs, long side ≤ 2× short side

privacy:
  file: privacy.html               # full HTML page; published to the GitHub Pages repo

declarations:
  preset: admob           # presets/<name>.yaml in playship
  ratingCategory: All Other App Types   # IARC: Game | Social or Communication | All Other App Types
  category: Sports                 # store category
  tags: [Sports, Hunting]
  overrides: {}                    # any preset answer key → replacement text
